language: ko-KR

reviews:
  profile: assertive
  high_level_summary: true
  review_status: true
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - develop
      - main
  path_instructions:
    - path: "android/app/src/**/*.kt"
      instructions: |
        Kotlin + Jetpack Compose Android 앱이다. 지도 · 위치 · 카메라 · 백엔드 등 외부 서비스의 현재 구성은 `README.md`의 Tech Stack을 참고하고,
        특정 라이브러리를 전제하지 말고 실제 변경 코드에서 쓰는 SDK 기준으로 검토해줘.
        팀 규칙은 `CONVENTION.md`, AI 작업 규칙은 `AGENTS.md`를 참고해줘. 다음 항목들을 꼼꼼하게 검토해줘.

        1. **리뷰 결과 정리 방식**
        - 발견사항은 Critical > High > Medium > Low > Suggestion 순서로 정리해줘.
        - Critical: 보안 취약점, 사용자 데이터 유실/오염, 인증 우회, 앱 크래시가 확실한 문제.
        - High: 런타임 예외 가능성, 권한 처리 누락, 잘못된 결과(경로 · 거리 · 사진 위치), 메모리 누수, 심각한 성능 저하, 디자인 토큰 미사용.
        - Medium: 유지보수성 저하, 테스트 누락, 경계값 오류 가능성, 불필요한 리컴포지션, 구조상 개선이 필요한 문제.
        - Low: 네이밍, 가독성, 작은 중복, 사소한 스타일 문제.
        - Suggestion: 당장 수정하지 않아도 되지만 장기적으로 품질을 높이는 개선 제안.
        - 각 리뷰 코멘트는 `[심각도] 제목` 형식으로 시작하고, 영향 범위와 수정 방향을 함께 제시해줘.
        - 같은 성격의 문제가 여러 개 있으면 대표 위치와 공통 해결 방향만 제시해줘.
        - 머지 전에 고쳐야 할 문제와 참고 수준의 문제를 명확히 구분해줘.
        - 문제가 없는 항목은 억지로 코멘트하지 말고, 실제 위험이 있는 변경에 집중해줘.

        2. **디자인 토큰 사용**
        - 색상 · 글꼴 · 간격 · 모양은 `ui/theme`의 토큰(`Color.kt`, `Type.kt`, `Shape.kt`, `Spacing.kt`, `MaterialTheme`)만 사용해야 한다.
        - `ui/theme` 밖에서 아래 값이 직접 쓰이면 `[High] 디자인 토큰 미사용`으로 지적해줘.
          - `Color(0xFF...)`, `Color.Red` 같은 직접 색상, hex 문자열
          - `16.dp`, `14.sp` 같은 직접 쓴 간격 · 크기 · 글꼴 크기 (`0.dp`, `1.dp` 구분선 정도는 예외)
          - `TextStyle(fontSize = ...)`, `FontWeight` 직접 지정
          - `RoundedCornerShape(8.dp)` 같은 직접 쓴 모양
        - 비슷한 토큰이 이미 있으면 그 토큰 이름을, 없으면 `ui/theme`에 추가할 토큰 이름을 제안해줘.

        3. **Compose 및 UI**
        - Composable이 상태를 직접 들고 있지 않고 `UiState`를 받아 그리는 구조(state hoisting)인지 확인해줘.
        - `remember`, `rememberSaveable`, `derivedStateOf`, `LaunchedEffect`의 key가 의도와 맞는지 확인해줘.
        - 불필요한 리컴포지션을 유발하는 불안정한 파라미터(가변 컬렉션, 람다 재생성 등)가 없는지 확인해줘.
        - `LazyColumn` 등에서 `key`를 지정했는지, 큰 이미지를 그대로 로드하지 않는지 확인해줘.
        - 화면에 보이는 문구가 `strings.xml`이 아닌 하드코딩 문자열인지 확인해줘.
        - 접근성(`contentDescription`, 터치 영역 크기)이 누락되지 않았는지 확인해줘.

        4. **아키텍처 및 구조**
        - 화면은 `XxxScreen` + `XxxViewModel` + `XxxUiState` 구조를 따르는지 확인해줘.
        - 화면 · ViewModel에서 외부 SDK(백엔드, 지도, 위치, 카메라 등)를 직접 호출하지 않고 `data`의 Repository를 거치는지 확인해줘.
        - Repository가 SDK 전용 타입(문서 스냅샷, SDK 예외 등)을 그대로 밖으로 내보내지 않고 앱 내부 모델로 변환하는지 확인해줘.
        - `domain`의 로직(GPS 필터링, 거리 · 구간 계산, 사진 ↔ 경로 매칭, 코스 빌더)이 Android · 외부 SDK 의존성 없이 순수 Kotlin으로 작성되었는지 확인해줘.
        - 새 라이브러리가 추가되었다면 꼭 필요한지, 기존 의존성이나 표준 API로 대체할 수 없는지 확인해줘.
        - 새 코드가 `feature/auth`, `feature/record`, `feature/photomap`, `feature/discover`, `feature/mypage`, `data`, `domain`, `ui` 중 맞는 위치에 있는지 확인해줘. PR 라벨러가 경로로 라벨을 붙이므로 위치가 틀리면 지적해줘.
        - feature 간 직접 의존이나 순환 의존이 없는지 확인해줘.

        5. **코루틴 및 비동기**
        - `viewModelScope`, `lifecycleScope`를 사용하고 `GlobalScope`를 쓰지 않는지 확인해줘.
        - 네트워크 · 디스크 작업이 메인 스레드에서 실행되지 않는지 확인해줘.
        - Flow 수집 시 `collectAsStateWithLifecycle` 등 생명주기를 고려했는지 확인해줘.
        - 코루틴 예외가 처리되지 않고 앱이 죽을 위험이 없는지 확인해줘.
        - 실시간 구독 · 콜백 · 리스너를 해제하지 않아 누수가 생기지 않는지 확인해줘.

        6. **위치 · 카메라 · 권한**
        - 위치 · 카메라 · 사진 접근 권한을 요청 · 거부 · 영구 거부 경우까지 처리했는지 확인해줘.
        - 위치 업데이트를 화면을 떠나거나 기록이 끝나면 중지하는지 확인해줘 (배터리 소모).
        - 백그라운드 위치 추적이 필요한 경우 Foreground Service와 알림을 사용했는지 확인해줘.
        - 카메라 · 지도 같은 무거운 리소스가 생명주기에 맞게 해제되는지 확인해줘.

        7. **GPS 및 도메인 로직**
        - GPS 튐(급격한 점프), 정확도가 낮은 점, 중복 좌표를 걸러내는 기준이 명확한지 확인해줘.
        - 거리 계산이 위경도 기준으로 올바른지(하버사인 등), 단위(m/km)가 일관적인지 확인해줘.
        - 사진 ↔ 경로 매칭 시 시간대(타임존), EXIF 위치 누락, 경로 밖 사진 같은 경계값을 처리했는지 확인해줘.
        - 매직 넘버(거리 임계값, 속도 기준 등)는 이름 있는 상수로 분리했는지 확인해줘.

        8. **원격 데이터 접근**
        - 서버 · DB 읽기 횟수가 과도하지 않은지(반복 조회, 전체 목록 조회 등) 확인해줘.
        - 목록 조회에 페이지네이션을 사용했는지, 필요한 인덱스 · 정렬 조건이 고려되었는지 확인해줘.
        - 여러 사용자가 동시에 같은 값을 바꿀 수 있는 곳(좋아요 수, 저장 수 등)이 원자적 업데이트나 트랜잭션으로 처리되는지 확인해줘.
        - 사진 업로드 시 이미지 리사이즈 · 압축, 실패 · 취소 처리를 했는지 확인해줘.
        - 원격 데이터와 앱 내부 모델 간 변환이 Repository에서 처리되는지 확인해줘.

        9. **예외 처리 및 보안**
        - 네트워크 실패, 서버 · SDK 오류, 권한 거부 시 사용자에게 적절한 상태를 보여주는지 확인해줘.
        - 예외를 삼키고(`catch` 후 무시) 넘어가는 곳이 없는지 확인해줘.
        - API 키, 토큰, 사용자 이메일 · 위치 같은 민감 정보가 코드에 하드코딩되거나 로그(`Log.d` 등)에 남지 않는지 확인해줘.
        - 다른 사용자의 데이터를 수정 · 삭제할 수 있는 경로가 클라이언트 코드에 없는지 확인해줘.

        10. **테스트**
        - `domain` 로직(GPS 필터링, 거리 계산, 매칭)에 단위 테스트가 있는지, 경계값 · 예외 케이스를 포함하는지 확인해줘.
        - ViewModel 테스트에서 Repository를 가짜(fake/mock)로 대체해 독립적으로 테스트하는지 확인해줘.
        - 테스트가 실행 순서나 실제 서버 · 네트워크에 의존하지 않는지 확인해줘.

    - path: "android/app/src/main/java/**/ui/theme/**"
      instructions: |
        디자인 토큰 정의 파일이다. 여기서는 직접 값(`Color(0xFF...)`, `16.dp` 등)을 정의하는 것이 정상이다.
        - 토큰 이름이 용도를 드러내는지(`Primary`, `SpacingMedium` 등), 중복 · 비슷한 값의 토큰이 늘어나지 않는지 확인해줘.
        - 다크 모드 색상이 함께 정의되었는지 확인해줘.

    - path: "android/app/src/main/res/**"
      instructions: |
        - 문자열이 `strings.xml`에 있고, 한국어 문구가 자연스러운지 확인해줘.
        - `colors.xml`에 Compose 화면용 색상이 추가되지 않았는지 확인해줘. Compose 색상은 `ui/theme/Color.kt`에서 관리한다.
        - 이미지 리소스가 불필요하게 크지 않은지 확인해줘.

    - path: "android/app/src/main/AndroidManifest.xml"
      instructions: |
        - 꼭 필요한 권한만 요청하는지, 백그라운드 위치 권한처럼 민감한 권한을 추가했다면 이유가 명확한지 확인해줘.
        - `exported` 설정이 올바른지 확인해줘.

    - path: "android/**/*.gradle.kts"
      instructions: |
        - 의존성 버전은 `gradle/libs.versions.toml`(Version Catalog)로 관리하는지 확인해줘.
        - API 키나 비밀 값이 빌드 스크립트에 하드코딩되지 않았는지 확인해줘. `local.properties`나 secrets plugin을 사용해야 한다.

    - path: "firebase/**"
      instructions: |
        백엔드 보안 규칙 · 설정 파일이다.
        - 누구나 읽고 쓸 수 있는 전체 공개 규칙이 없는지 확인해줘.
        - 본인 데이터만 수정 · 삭제할 수 있도록 로그인 사용자 식별 검사가 되어 있는지 확인해줘.
        - 공개 코스처럼 다른 사람이 읽을 수 있는 데이터와 비공개 데이터가 구분되어 있는지 확인해줘.
        - 파일 업로드에 크기 · 타입 제한이 있는지 확인해줘.

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/.idea/**"
    - "!android/gradle/wrapper/**"
    - "!android/gradlew"
    - "!android/gradlew.bat"
    - "!**/*.webp"
    - "!**/*.png"
